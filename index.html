<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Airbeat Festival QR</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
<div id="achievement" class="hidden">
  <div class="achievement-box">
    <h2 id="achievementTitle"></h2>
    <p id="achievementText"></p>
  </div>
</div>

<div class="card">


<h1>🍻 AIRBEAT QR</h1>

<div class="subtitle">
Dein Festival in einem QR-Code
</div>



<div class="counter">

<div id="scans">
👀 Scans: 0
</div>

</div>



<div class="message" id="message">

Lade...

</div>



<div class="random" id="random">

🎲 Lade Spruch...

</div>



<div class="stats">


<div class="stat" id="beers">
🍺 Bier: 0
</div>


<div class="stat" id="laughs">
😂 Lacher: 0
</div>


<div class="stat" id="highfives">
🙌 High Fives: 0
</div>


<div class="stat" id="dances">
💃 Tänze: 0
</div>


</div>



<button class="beer" id="beer">
🍺 Ich habe ein Bier ausgegeben
</button>


<button class="laugh" id="laugh">
😂 Musste lachen
</button>


<button class="highfive" id="highfive">
🙌 High Five
</button>


<button class="dance" id="dance">
💃 Wir haben getanzt
</button>



<div class="footer">

QR powered by Festival Mode 🚀

</div>


</div>



<script type="module" src="app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
</body>

</html>
