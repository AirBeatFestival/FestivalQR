<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Airbeat Festival QR</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  background: #111;
  color: white;
}

h1 {
  font-size: 32px;
}

#message {
  margin-top: 50px;
  font-size: 28px;
}

</style>
</head>

<body>

<h1>🍻 AIRBEAT QR</h1>

<div id="message">
Lade...
</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyAaBRt_uKXAn9-MNiXc-RDdgk48-ztr_A4",
authDomain: "airbeatfestivalqr.firebaseapp.com",
projectId: "airbeatfestivalqr",
storageBucket: "airbeatfestivalqr.firebasestorage.app",
messagingSenderId: "529699781521",
appId: "1:529699781521:web:369f5ebaf711d9076c3830"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


onSnapshot(
doc(db,"festival","message"),
(snapshot)=>{

if(snapshot.exists()){
document.getElementById("message").innerHTML =
snapshot.data().text;
}

});

</script>


</body>
</html>
